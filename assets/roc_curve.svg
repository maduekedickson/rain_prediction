<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #1E293B; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748B; }
      .axis { stroke: #94A3B8; stroke-width: 1.5; }
      .grid { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 4; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .legend-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
    </style>
  </defs>

  <rect width="600" height="480" fill="#FFFFFF" rx="10"/>

  <text x="40" y="35" class="title">Receiver Operating Characteristic (ROC) Benchmark</text>
  <text x="40" y="55" class="sub">Holdout Discrimination Curve across Meteorological Classifiers</text>

  <!-- Plot Area: x from 80 to 440 (width 360), y from 390 up to 90 (height 300) -->
  <!-- Grid lines -->
  <line x1="80" y1="390" x2="440" y2="390" class="axis"/>
  <line x1="80" y1="390" x2="80" y2="90" class="axis"/>

  <line x1="170" y1="390" x2="170" y2="90" class="grid"/>
  <line x1="260" y1="390" x2="260" y2="90" class="grid"/>
  <line x1="350" y1="390" x2="350" y2="90" class="grid"/>
  <line x1="440" y1="390" x2="440" y2="90" class="grid"/>

  <line x1="80" y1="315" x2="440" y2="315" class="grid"/>
  <line x1="80" y1="240" x2="440" y2="240" class="grid"/>
  <line x1="80" y1="165" x2="440" y2="165" class="grid"/>
  <line x1="80" y1="90" x2="440" y2="90" class="grid"/>

  <!-- Ticks & Labels -->
  <text x="80" y="410" class="axis-lbl" text-anchor="middle">0.0</text>
  <text x="170" y="410" class="axis-lbl" text-anchor="middle">0.25</text>
  <text x="260" y="410" class="axis-lbl" text-anchor="middle">0.50</text>
  <text x="350" y="410" class="axis-lbl" text-anchor="middle">0.75</text>
  <text x="440" y="410" class="axis-lbl" text-anchor="middle">1.0</text>

  <text x="70" y="395" class="axis-lbl" text-anchor="end">0.0</text>
  <text x="70" y="320" class="axis-lbl" text-anchor="end">0.25</text>
  <text x="70" y="245" class="axis-lbl" text-anchor="end">0.50</text>
  <text x="70" y="170" class="axis-lbl" text-anchor="end">0.75</text>
  <text x="70" y="95" class="axis-lbl" text-anchor="end">1.0</text>

  <text x="260" y="440" class="axis-lbl" text-anchor="middle" font-weight="bold">False Positive Rate (1 - Specificity)</text>
  <text x="30" y="240" class="axis-lbl" text-anchor="middle" font-weight="bold" transform="rotate(-90 30 240)">True Positive Rate (Sensitivity)</text>

  <!-- Chance line -->
  <line x1="80" y1="390" x2="440" y2="90" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6"/>

  <!-- Decision Tree curve (AUC 0.780) -->
  <path d="M 80 390 L 110 270 L 150 200 L 210 160 L 320 120 L 440 90" fill="none" stroke="#64748B" stroke-width="2"/>

  <!-- Gradient Boosting curve (AUC 0.830) -->
  <path d="M 80 390 L 105 240 L 130 180 L 180 140 L 280 110 L 440 90" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <!-- Random Forest curve (AUC 0.853) -->
  <path d="M 80 390 L 100 220 L 125 160 L 170 125 L 260 105 L 440 90" fill="none" stroke="#10B981" stroke-width="2.5"/>

  <!-- Logistic Regression curve (AUC 0.874) -->
  <path d="M 80 390 L 95 190 L 120 140 L 160 115 L 240 100 L 440 90" fill="none" stroke="#0288D1" stroke-width="3"/>

  <!-- Legend -->
  <rect x="230" y="270" width="200" height="110" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  
  <line x1="240" y1="290" x2="260" y2="290" stroke="#0288D1" stroke-width="3"/>
  <text x="270" y="294" class="legend-lbl">Logistic Reg. (AUC = 0.874)</text>

  <line x1="240" y1="315" x2="260" y2="315" stroke="#10B981" stroke-width="2.5"/>
  <text x="270" y="319" class="legend-lbl">Random Forest (AUC = 0.853)</text>

  <line x1="240" y1="340" x2="260" y2="340" stroke="#F59E0B" stroke-width="2"/>
  <text x="270" y="344" class="legend-lbl">Gradient Boost (AUC = 0.830)</text>

  <line x1="240" y1="365" x2="260" y2="365" stroke="#64748B" stroke-width="2"/>
  <text x="270" y="369" class="legend-lbl">Decision Tree (AUC = 0.780)</text>
</svg>
